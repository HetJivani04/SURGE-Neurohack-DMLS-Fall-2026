# Hierarchical model, gauge-fixing feature term ablated.
experiment: 11_ours_ablated

# Referenced configs, relative to this file. Their content is merged in under
# the keys `model` and `eval`.
includes:
  model: ../model/ablation_no_gauge.yaml
  eval: ../eval/default.yaml

run:
  seed: 0
  n_jobs: 1

eval:
  pairs:
    n: 500
    seed: 2026
  permutations:
    B: 10000
